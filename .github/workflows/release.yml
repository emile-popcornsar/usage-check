name: Release

# Pushing a tag like v0.1.1 builds the Windows installer and publishes it as a GitHub Release.
# Installed copies read that release (latest.yml) at start-up and update themselves.
# The tag must match "version" in package.json.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      # One release made in one call. electron-builder's own publishing uploads the files in parallel and can
      # create two releases for the same tag, and then the updater cannot find latest.yml (seen on v0.1.0).
      - name: Publish the release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME"             release/UsageCheck-Setup-*.exe release/UsageCheck-Setup-*.exe.blockmap release/latest.yml             --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
